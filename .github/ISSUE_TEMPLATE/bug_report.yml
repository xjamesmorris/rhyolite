name: Bug report
description: Report a reproducible problem with the repository-review plugin.
title: "[Bug]: "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting a problem. Please share sanitized details only.
  - type: input
    id: version
    attributes:
      label: Plugin version
      description: What version are you using?
      placeholder: 0.5.0
    validations:
      required: true
  - type: dropdown
    id: platform
    attributes:
      label: Operating system
      options:
        - Linux
        - macOS
        - Windows
        - Other
    validations:
      required: true
  - type: dropdown
    id: harness
    attributes:
      label: Review harness
      description: Which CLI ran the review? The `Harness:` line in `status` shows it.
      options:
        - GitHub Copilot CLI (copilot)
        - Claude Code (claude)
    validations:
      required: true
  - type: dropdown
    id: install-path
    attributes:
      label: Installation method
      options:
        - Local plugin checkout
        - Published marketplace install
        - Other
    validations:
      required: true
  - type: textarea
    id: summary
    attributes:
      label: What happened?
      description: Describe the observed behavior.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: Provide the smallest reliable reproduction.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Relevant logs or output
      description: Paste sanitized logs only. Do not include secrets or non-public repository details. For setup issues, note whether the persistent one-line availability notice appeared and include the `CURRENT SETUP STATUS` block or `status` output if available. For plan-hash mismatches, include the mismatch message and regenerated plan summary if available.
      render: shell
